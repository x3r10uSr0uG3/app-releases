name: Supabase keep-alive

# Supabase free-tier projects auto-pause after 7 days of inactivity.
# This ping every 3 days resets the inactivity timer.
# The publishable key is public by design (RLS protects the data) — no secret needed.

on:
  schedule:
    - cron: '17 13 */3 * *'  # every 3 days at 13:17 UTC
  workflow_dispatch:           # allow manual runs from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      # GitHub auto-disables scheduled workflows in public repos after 60 days without commits
      # (happened 2026-08-16 → Supabase paused → app login broke). Re-enabling via API resets that timer.
      - name: Keep this workflow from being auto-disabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/supabase-keepalive.yml/enable"

      - name: Ping Supabase REST API (with cold-start retries)
        env:
          SUPABASE_URL: https://lblyujpknrbzzhahkhtd.supabase.co
          SUPABASE_ANON_KEY: sb_publishable_WqwGYR1pmg_9B1Y3h9VrcQ_ExuhyWef
        run: |
          set -u
          URL="$SUPABASE_URL/rest/v1/profiles?select=id&limit=1"
          for i in $(seq 1 20); do
            CODE=$(curl -sS -o /tmp/body -w "%{http_code}" \
              -H "apikey: $SUPABASE_ANON_KEY" \
              -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
              "$URL") || true  # DNS/connection errors must retry, not abort under bash -e
            echo "attempt $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "DB awake — activity registered"
              exit 0
            fi
            sleep 6
          done
          echo "Failed to wake DB after 20 attempts"
          head -c 500 /tmp/body || true
          exit 1
